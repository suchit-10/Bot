<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SuchitBOT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .chat-wrapper {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 780px;
      height: 88vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      background: rgba(5, 5, 20, 0.75);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 40px rgba(0, 255, 255, 0.1),
        0 0 80px rgba(120, 0, 255, 0.1),
        inset 0 0 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Animated border */
    .chat-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: linear-gradient(90deg, #00ffff, #7800ff, #ff00aa, #00ffff);
      background-size: 300% 300%;
      animation: borderAnim 4s linear infinite;
      z-index: -1;
      opacity: 0.6;
    }

    @keyframes borderAnim {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Header */
    .chat-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ffff, #7800ff);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      animation: avatarPulse 2s ease-in-out infinite;
    }

    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
      50% { box-shadow: 0 0 40px rgba(0, 255, 255, 0.9), 0 0 60px rgba(120, 0, 255, 0.5); }
    }

    .header-title h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      background: linear-gradient(90deg, #00ffff, #7800ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }

    .header-title p {
      font-size: 11px;
      color: rgba(0, 255, 255, 0.5);
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px; height: 8px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff88;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #clear-btn {
      background: rgba(255, 0, 100, 0.1);
      border: 1px solid rgba(255, 0, 100, 0.4);
      color: #ff0064;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    #clear-btn:hover {
      background: rgba(255, 0, 100, 0.3);
      box-shadow: 0 0 20px rgba(255, 0, 100, 0.4);
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 255, 255, 0.3) transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 2px; }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
    }

    .message-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg-avatar.bot-av {
      background: linear-gradient(135deg, #00ffff22, #7800ff22);
      border: 1px solid rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .msg-avatar.user-av {
      background: linear-gradient(135deg, #ff00aa22, #7800ff22);
      border: 1px solid rgba(255, 0, 170, 0.4);
      box-shadow: 0 0 10px rgba(255, 0, 170, 0.3);
    }

    .message {
      max-width: 68%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      position: relative;
    }

    .message.bot {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.2);
      color: #e0f7ff;
      border-bottom-left-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
    }

    .message.user {
      background: linear-gradient(135deg, rgba(120, 0, 255, 0.3), rgba(255, 0, 170, 0.2));
      border: 1px solid rgba(120, 0, 255, 0.4);
      color: #f0e0ff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 0 20px rgba(120, 0, 255, 0.15);
    }

    /* Markdown styles inside messages */
    .message p { margin-bottom: 8px; }
    .message p:last-child { margin-bottom: 0; }
    .message code {
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 200, 0.2);
    }
    .message pre {
      background: rgba(0, 0, 0, 0.6) !important;
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .message pre code { background: none; border: none; padding: 0; color: inherit; }
    .message ul, .message ol { padding-left: 20px; margin: 8px 0; }
    .message strong { color: #00ffff; }
    .message h1, .message h2, .message h3 {
      font-family: 'Orbitron', sans-serif;
      color: #00ffff;
      margin: 10px 0 6px;
      font-size: 14px;
    }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 18px;
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }

    .typing-indicator span {
      width: 8px; height: 8px;
      background: #00ffff;
      border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
      box-shadow: 0 0 8px #00ffff;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; background: #7800ff; box-shadow: 0 0 8px #7800ff; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; background: #ff00aa; box-shadow: 0 0 8px #ff00aa; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

    /* Input area */
    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid rgba(0, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 255, 255, 0.04);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 50px;
      padding: 8px 8px 8px 20px;
      transition: all 0.3s;
    }

    .input-container:focus-within {
      border-color: rgba(0, 255, 255, 0.6);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15), 0 0 60px rgba(120, 0, 255, 0.1);
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e0f7ff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    #input::placeholder { color: rgba(0, 255, 255, 0.3); }

    #send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ffff, #7800ff);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      flex-shrink: 0;
    }

    #send-btn:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.7), 0 0 60px rgba(120, 0, 255, 0.4);
    }

    #send-btn:active { transform: scale(0.95); }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: rgba(0, 255, 255, 0.2);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* Scanline effect */
    .scanlines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Neon flicker on title */
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.8; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
      99% { opacity: 1; }
    }

    .header-title h1 { animation: flicker 5s infinite; }
  </style>
</head>
<body>
  <canvas id="canvas-bg"></canvas>
  <div class="scanlines"></div>

  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="header-left">
        <div class="ai-avatar">🤖</div>
        <div class="header-title">
          <h1>SuchitBOT</h1>
          <p>POWERED BY LLAMA 3.3 · GROQ · BUILT BY SUCHIT</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="status-dot"></div>
        <button id="clear-btn">⚡ CLEAR</button>
      </div>
    </div>

    <div id="messages">
      <div class="message-row" id="welcome-row">
        <div class="msg-avatar bot-av">🤖</div>
        <div class="message bot">
          Hey! I'm <strong>SuchitBOT</strong> — built by Suchit, powered by <strong>Llama 3.3 70B</strong> via Groq. 🔥<br/>Ask me anything. I don't bite... much. 😈
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-container">
        <input id="input" type="text" placeholder="Ask SuchitBOT anything..." autocomplete="off"/>
        <button id="send-btn">➤</button>
      </div>
      <p class="input-hint">PRESS ENTER OR CLICK ➤ TO SEND</p>
    </div>
  </div>

  <script>
    // ── Three.js Galaxy Background ──────────────────────────────────────
    const canvas = document.getElementById('canvas-bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // Particles
    const particleCount = 6000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const colorOptions = [
      [0, 1, 1],       // cyan
      [0.47, 0, 1],    // purple
      [1, 0, 0.67],    // pink
      [0, 1, 0.53],    // green
      [1, 0.6, 0],     // orange
    ];

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 30;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 30;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 30;
      const c = colorOptions[Math.floor(Math.random() * colorOptions.length)];
      colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.8 });
    const particles = new THREE.Points(geo, mat);
    scene.add(particles);

    // Floating rings
    const rings = [];
    const ringColors = [0x00ffff, 0x7800ff, 0xff00aa];
    for (let i = 0; i < 3; i++) {
      const rGeo = new THREE.TorusGeometry(3 + i * 2, 0.02, 16, 100);
      const rMat = new THREE.MeshBasicMaterial({ color: ringColors[i], transparent: true, opacity: 0.15 });
      const ring = new THREE.Mesh(rGeo, rMat);
      ring.rotation.x = Math.random() * Math.PI;
      ring.rotation.y = Math.random() * Math.PI;
      scene.add(ring);
      rings.push(ring);
    }

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.0003;
      particles.rotation.x += 0.0001;
      rings.forEach((r, i) => {
        r.rotation.x += 0.002 * (i + 1);
        r.rotation.y += 0.001 * (i + 1);
      });
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY * 0.5 - camera.position.y) * 0.02;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── GSAP animate welcome message ────────────────────────────────────
    gsap.to('#welcome-row', { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' });

    // ── Chat Logic ───────────────────────────────────────────────────────
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');

    function addMessage(html, role) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = `msg-avatar ${role === 'user' ? 'user-av' : 'bot-av'}`;
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.innerHTML = html;

      if (role === 'user') { row.appendChild(msg); row.appendChild(avatar); }
      else { row.appendChild(avatar); row.appendChild(msg); }

      messagesEl.appendChild(row);
      msg.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));

      gsap.to(row, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' });
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing';
      row.innerHTML = `
        <div class="msg-avatar bot-av">🤖</div>
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>`;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';

      addMessage(text, 'user');
      showTyping();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        removeTyping();
        addMessage(marked.parse(data.reply), 'bot');
      } catch {
        removeTyping();
        addMessage('⚠️ Connection error. Please try again.', 'bot');
      }
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    document.getElementById('clear-btn').addEventListener('click', async () => {
      await fetch('/chat', { method: 'DELETE' });
      messagesEl.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'message-row';
      row.style.opacity = 0;
      row.innerHTML = `<div class="msg-avatar bot-av">🤖</div><div class="message bot">Chat cleared! SuchitBOT is ready to go again. ⚡</div>`;
      messagesEl.appendChild(row);
      gsap.to(row, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' });
    });
  </script>
</body>
</html>
